version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bolysubot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bolysubot
      POSTGRES_USER: bolysubot_user
      POSTGRES_PASSWORD: bolysubot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolysubot_user -d bolysubot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Раскомментируйте, если хотите запускать бота в Docker
